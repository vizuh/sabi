<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Seven rounds, one trajectory: session, search, edit, test, failure, recovery, verify</title>
  <desc id="desc">Each round carries evidence and names its rule: session model first, cheap for search, mid for edit and test, strong for failure and recovery, mid for verification.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="1200" height="430" fill="#0b0f14"/>
  <rect width="1200" height="430" fill="url(#grid)"/>
  <text class="sans" x="60" y="58" font-size="28" font-weight="800" fill="#f2f5f9">Seven rounds, one trajectory</text>
  <text class="sans" x="60" y="86" font-size="15" fill="#8b98a9">Each round carries evidence; each decision names its rule.</text>
  <path d="M80 205 H1120" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <text class="sans" x="80" y="150" font-size="17" font-weight="800" fill="#f2f5f9" text-anchor="middle">Session</text>
  <text class="sans" x="253" y="150" font-size="17" font-weight="800" fill="#f2f5f9" text-anchor="middle">Search</text>
  <text class="sans" x="427" y="150" font-size="17" font-weight="800" fill="#f2f5f9" text-anchor="middle">Edit</text>
  <text class="sans" x="600" y="150" font-size="17" font-weight="800" fill="#f2f5f9" text-anchor="middle">Test</text>
  <text class="sans" x="773" y="150" font-size="17" font-weight="800" fill="#f87171" text-anchor="middle">Failure</text>
  <text class="sans" x="947" y="150" font-size="17" font-weight="800" fill="#f2f5f9" text-anchor="middle">Recovery</text>
  <text class="sans" x="1120" y="150" font-size="17" font-weight="800" fill="#f2f5f9" text-anchor="middle">Verify</text>
  <circle cx="80" cy="205" r="25" fill="#0b0f14" stroke="#475569" stroke-width="3"/>
  <text class="sans" x="80" y="212" font-size="18" font-weight="800" fill="#e8edf3" text-anchor="middle">1</text>
  <circle cx="253" cy="205" r="25" fill="#0b0f14" stroke="#34d399" stroke-width="3"/>
  <text class="sans" x="253" y="212" font-size="18" font-weight="800" fill="#e8edf3" text-anchor="middle">2</text>
  <circle cx="427" cy="205" r="25" fill="#0b0f14" stroke="#60a5fa" stroke-width="3"/>
  <text class="sans" x="427" y="212" font-size="18" font-weight="800" fill="#e8edf3" text-anchor="middle">3</text>
  <circle cx="600" cy="205" r="25" fill="#0b0f14" stroke="#60a5fa" stroke-width="3"/>
  <text class="sans" x="600" y="212" font-size="18" font-weight="800" fill="#e8edf3" text-anchor="middle">4</text>
  <circle cx="773" cy="205" r="25" fill="#0b0f14" stroke="#f87171" stroke-width="3"/>
  <text class="sans" x="773" y="212" font-size="18" font-weight="800" fill="#e8edf3" text-anchor="middle">5</text>
  <circle cx="947" cy="205" r="25" fill="#0b0f14" stroke="#fbbf24" stroke-width="3"/>
  <text class="sans" x="947" y="212" font-size="18" font-weight="800" fill="#e8edf3" text-anchor="middle">6</text>
  <circle cx="1120" cy="205" r="25" fill="#0b0f14" stroke="#60a5fa" stroke-width="3"/>
  <text class="sans" x="1120" y="212" font-size="18" font-weight="800" fill="#e8edf3" text-anchor="middle">7</text>
  <rect x="38" y="250" width="84" height="28" rx="14" fill="#161e29" stroke="#2b3948"/>
  <text class="mono" x="80" y="269" font-size="12" fill="#aeb9c7" text-anchor="middle">session</text>
  <rect x="196" y="250" width="114" height="28" rx="14" fill="#161e29" stroke="#2b3948"/>
  <text class="mono" x="253" y="269" font-size="12" fill="#aeb9c7" text-anchor="middle">exploration</text>
  <rect x="358" y="250" width="138" height="28" rx="14" fill="#161e29" stroke="#2b3948"/>
  <text class="mono" x="427" y="269" font-size="12" fill="#aeb9c7" text-anchor="middle">implementation</text>
  <rect x="539" y="250" width="122" height="28" rx="14" fill="#161e29" stroke="#2b3948"/>
  <text class="mono" x="600" y="269" font-size="12" fill="#aeb9c7" text-anchor="middle">verification</text>
  <rect x="731" y="250" width="84" height="28" rx="14" fill="#2a1518" stroke="#7f3434"/>
  <text class="mono" x="773" y="269" font-size="12" fill="#fca5a5" text-anchor="middle">failure</text>
  <rect x="913" y="250" width="68" height="28" rx="14" fill="#161e29" stroke="#2b3948"/>
  <text class="mono" x="947" y="269" font-size="12" fill="#aeb9c7" text-anchor="middle">stuck</text>
  <rect x="1059" y="250" width="122" height="28" rx="14" fill="#161e29" stroke="#2b3948"/>
  <text class="mono" x="1120" y="269" font-size="12" fill="#aeb9c7" text-anchor="middle">verification</text>
  <rect x="24" y="292" width="112" height="36" rx="18" fill="#161e29" stroke="#475569" stroke-width="1.5"/>
  <text class="sans" x="80" y="316" font-size="14" font-weight="800" fill="#94a3b8" text-anchor="middle">SESSION</text>
  <rect x="197" y="292" width="112" height="36" rx="18" fill="#0d1f18" stroke="#34d399" stroke-width="1.5"/>
  <text class="sans" x="253" y="316" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle">CHEAP</text>
  <rect x="371" y="292" width="112" height="36" rx="18" fill="#0e1a2e" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="sans" x="427" y="316" font-size="14" font-weight="800" fill="#60a5fa" text-anchor="middle">MID</text>
  <rect x="544" y="292" width="112" height="36" rx="18" fill="#0e1a2e" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="sans" x="600" y="316" font-size="14" font-weight="800" fill="#60a5fa" text-anchor="middle">MID</text>
  <rect x="717" y="292" width="112" height="36" rx="18" fill="#231a0c" stroke="#fbbf24" stroke-width="1.5"/>
  <text class="sans" x="773" y="316" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="middle">STRONG</text>
  <rect x="891" y="292" width="112" height="36" rx="18" fill="#231a0c" stroke="#fbbf24" stroke-width="1.5"/>
  <text class="sans" x="947" y="316" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="middle">STRONG</text>
  <rect x="1064" y="292" width="112" height="36" rx="18" fill="#0e1a2e" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="sans" x="1120" y="316" font-size="14" font-weight="800" fill="#60a5fa" text-anchor="middle">MID</text>
  <text class="mono" x="600" y="392" font-size="14" fill="#8b98a9" text-anchor="middle">evidence → rule → tier, recorded every round</text>
</svg>
