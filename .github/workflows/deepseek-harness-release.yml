name: deepseek-harness-release

# Publish the DSH bundle only after its source and lockfile are merged.
# Release command: git tag dsh-vX.Y.Z && git push origin dsh-vX.Y.Z
on:
  push:
    tags: ['dsh-v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify tag matches the bundle version
        run: |
          tag_version="${GITHUB_REF_NAME#dsh-v}"
          package_version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/adapters/deepseek-harness/package.json', 'utf8')).version)")"
          test "$tag_version" = "$package_version"
      - name: Publish @vizuh/sabi-deepseek-harness
        id: publish
        run: |
          version="${GITHUB_REF_NAME#dsh-v}"
          if npm view "@vizuh/sabi-deepseek-harness@$version" version >/dev/null 2>&1; then
            echo "state=already" >> "$GITHUB_OUTPUT"
            echo "@vizuh/sabi-deepseek-harness@$version is already published — skipping."
          else
            npm publish ./packages/adapters/deepseek-harness --access public --provenance
            echo "state=fresh" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub Release — exact npm tarball
        run: |
          version="${GITHUB_REF_NAME#dsh-v}"
          mkdir -p dist
          if [ "${{ steps.publish.outputs.state }}" = "fresh" ]; then
            npm pack ./packages/adapters/deepseek-harness --pack-destination dist
          else
            npm pack "@vizuh/sabi-deepseek-harness@$version" --pack-destination dist
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes --title "Sabi DeepSeek Harness $version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
