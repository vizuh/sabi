name: router-release

# Sabi itself is published as a library: @vizuh/sabi-router is the routing layer, the engine the
# CLI and the per-host adapters are built on. This lane publishes only that package; the controller
# has its own controller-v* lane and the mod keeps the v* lane.
on:
  push:
    tags: ['router-v*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build router package
        run: npm run build:router
        env:
          SABI_ROUTER_VERSION: ${{ github.ref_name }}
      - name: Publish @vizuh/sabi-router
        id: publish
        run: |
          version="${GITHUB_REF_NAME#router-v}"
          if npm view "@vizuh/sabi-router@$version" version >/dev/null 2>&1; then
            echo "state=already" >> "$GITHUB_OUTPUT"
            echo "@vizuh/sabi-router@$version is already published — skipping."
          else
            npm publish ./packages/core/pkg --access public --provenance
            echo "state=fresh" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub Release
        run: |
          version="${GITHUB_REF_NAME#router-v}"
          mkdir -p dist
          if [ "${{ steps.publish.outputs.state }}" = "fresh" ]; then
            npm pack ./packages/core/pkg --pack-destination dist
          else
            npm pack "@vizuh/sabi-router@$version" --pack-destination dist
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes --title "Sabi router $version"
        env:
          GH_TOKEN: ${{ github.token }}
